name: Sync juku schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./juku-calendar-sync-starter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juku-calendar-sync-starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run calendar sync
        run: npm start
        env:
          JUKU_ACCOUNT: ${{ secrets.JUKU_ACCOUNT }}           
          JUKU_PASSWORD: ${{ secrets.JUKU_PASS_TEST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}           
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
